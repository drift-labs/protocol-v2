name: "Setup Solana"
description: "Setup Solana"
runs:
  using: "composite"
  steps:
    - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
      name: Cache Solana Tool Suite
      id: cache-solana
      with:
        path: |
          ~/.cache/solana/
          ~/.local/share/solana/
        key: solana-${{ runner.os }}-v0000-${{ env.SOLANA_VERSION }}
    - name: Download Solana
      run: |
        echo Downloading Solana v${{ env.SOLANA_VERSION }}... 🧬
        export SOLANA_RELEASE=v${{ env.SOLANA_VERSION }}
        export SOLANA_INSTALL_INIT_ARGS=v${{ env.SOLANA_VERSION }}
        ${{ github.workspace }}/.github/actions/setup-solana/scripts/solana-install-init.sh
        echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
        # Default CLI identity. Generate it fresh rather than echoing a hardcoded
        # keypair array — a literal keypair in the run script gets printed verbatim
        # into the workflow log. Real signing in every flow uses an explicit
        # -k/--keypair (the deployer secret), never this throwaway identity.
        mkdir -p "$HOME/.config/solana"
        solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
      shell: bash