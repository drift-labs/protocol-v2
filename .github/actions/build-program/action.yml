name: "Build Program (verified + IDL)"
description: >
  Runs `anchor idl build` (for the IDL JSON only — no SBF compile) and
  `solana-verify build` (for the deployable .so) for one program. Devnet variant
  strips the `mainnet-beta` cargo feature so velocity's cfg-gated declare_id!
  resolves to the devnet pubkey.
inputs:
  program:
    description: "Program crate name (velocity | token_faucet)"
    required: true
  devnet:
    description: "If 'true', strip mainnet-beta feature (velocity only)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Rust toolchain
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        profile: minimal
        override: true
    - name: Cache cargo
      uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
      with:
        cache-on-failure: "true"
    - uses: ./.github/actions/setup-solana/
    - uses: ./.github/actions/setup-anchor/

    - name: Cache solana-verify
      id: cache-solana-verify
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/bin/solana-verify
        key: ${{ runner.os }}-solana-verify-0.5.0

    - name: Install solana-verify
      if: steps.cache-solana-verify.outputs.cache-hit != 'true'
      shell: bash
      # 0.5.0 (matches solana-foundation/github-actions) for `export-pda-tx`,
      # used by the mainnet verify-PDA flow. The verifiable build still runs
      # inside the pinned VERIFIABLE_BUILD_IMAGE, so the CLI version does not
      # affect the build hash.
      run: |
        sudo apt update -y && sudo apt install -y libudev-dev
        cargo install solana-verify --version 0.5.0 --locked

    - name: Anchor IDL build (produces IDL only — no SBF compile)
      shell: bash
      env:
        PROGRAM: ${{ inputs.program }}
        DEVNET: ${{ inputs.devnet }}
      run: |
        set -euo pipefail
        # `anchor idl build -o` writes via File::create and does NOT create parent
        # dirs; a full `anchor build` used to create target/idl as a side effect.
        mkdir -p target/idl
        if [ "$PROGRAM" = "velocity" ] && [ "$DEVNET" = "true" ]; then
          anchor idl build --skip-lint -p velocity -o target/idl/velocity.json -- --no-default-features --features no-entrypoint
        else
          anchor idl build --skip-lint -p "$PROGRAM" -o "target/idl/$PROGRAM.json"
        fi
        ls -l target/idl/

    - name: Verifiable build (produces deployable .so)
      shell: bash
      env:
        PROGRAM: ${{ inputs.program }}
        DEVNET: ${{ inputs.devnet }}
      run: |
        set -euo pipefail
        if [ "$PROGRAM" = "velocity" ] && [ "$DEVNET" = "true" ]; then
          solana-verify build --library-name velocity -b "$VERIFIABLE_BUILD_IMAGE" -- --no-default-features --features no-entrypoint
        else
          solana-verify build --library-name "$PROGRAM" -b "$VERIFIABLE_BUILD_IMAGE"
        fi
        ls -l target/deploy/

    - name: Upload .so artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.program }}-${{ inputs.devnet == 'true' && 'devnet' || 'mainnet' }}-so
        path: target/deploy/${{ inputs.program }}.so

    - name: Upload IDL artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.program }}-${{ inputs.devnet == 'true' && 'devnet' || 'mainnet' }}-idl
        path: target/idl/${{ inputs.program }}.json
