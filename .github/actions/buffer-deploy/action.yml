name: "Buffer Deploy"
description: >
  Stages a Squads-controlled program upgrade using the Solana Foundation
  `prepare-squads-release` action: it writes `target/deploy/<program>.so` to a
  BPF Upgradeable Loader buffer (resumable — re-writes only missing chunks on
  retry), `target/idl/<program>.json` to a program-metadata buffer, optionally
  exports a solana-verify PDA transaction, and transfers both buffer authorities
  to the multisig vault. It then re-emits the verify-before-approving summary
  (program buffer + on-chain buffer hash vs the local verifiable .so hash) that a
  multisig signer uses to confirm the staged program before approving the Squads
  proposal.
inputs:
  program:
    description: "Program crate name (velocity | token_faucet)"
    required: true
  program-id:
    description: "On-chain program ID being upgraded (for the resize check)"
    required: true
  rpc-url:
    description: "Solana RPC URL"
    required: true
  keypair:
    description: "Deployer keypair JSON (raw [..] array string from a secret)"
    required: true
  buffer-authority:
    description: "Address that should own both buffers after upload (the multisig vault PDA)"
    required: true
  priority-fee:
    description: "Priority fee in microlamports for buffer-write transactions"
    required: false
    default: "100000"
  export-verify-pda:
    description: "Export a solana-verify PDA transaction for the Squads proposal (mainnet only)"
    required: false
    default: "false"
  repo-url:
    description: "GitHub repository URL (required when export-verify-pda is true)"
    required: false
    default: ""
  commit-hash:
    description: "Git commit to verify against (required when export-verify-pda is true)"
    required: false
    default: ""

outputs:
  buffer:
    description: "BPF buffer address"
    value: ${{ steps.prepare.outputs.buffer }}
  metadata-buffer:
    description: "Program-metadata IDL buffer address"
    value: ${{ steps.prepare.outputs.metadata-buffer }}
  pda-tx:
    description: "Base64-encoded solana-verify PDA transaction (empty unless export-verify-pda)"
    value: ${{ steps.prepare.outputs.pda-tx }}

runs:
  using: "composite"
  steps:
    - name: Setup node
      uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
      with:
        node-version: ${{ env.NODE_VERSION }}

    # The canonical IDL metadata account is created once at initial program
    # deploy (see deploy-scripts/README.md) — CI only ever updates it via the
    # official squads action's single-tx SetData, so no pre-flight check here.

    - name: Prepare Squads release (program + metadata buffers)
      id: prepare
      uses: solana-foundation/github-actions/prepare-squads-release@f0ddc2234ac4ac19c5c17f520b60bc2d7308744f # v0.2.11
      with:
        program-id: ${{ inputs.program-id }}
        program: ${{ inputs.program }}
        rpc-url: ${{ inputs.rpc-url }}
        keypair: ${{ inputs.keypair }}
        squads-vault: ${{ inputs.buffer-authority }}
        metadata-path: ./target/idl/${{ inputs.program }}.json
        priority-fee: ${{ inputs.priority-fee }}
        # velocity.so is ~5 MB; force RPC transport + retries so a partial
        # buffer resumes (re-sending only the missing chunks) instead of failing.
        program-buffer-use-rpc: "true"
        program-buffer-retry-attempts: "5"
        program-buffer-max-sign-attempts: "50"
        export-verify-pda: ${{ inputs.export-verify-pda }}
        repo-url: ${{ inputs.repo-url }}
        commit-hash: ${{ inputs.commit-hash }}

    - name: Deploy summary + verifiable hashes
      shell: bash
      env:
        PROGRAM: ${{ inputs.program }}
        RPC_URL: ${{ inputs.rpc-url }}
        BUFFER: ${{ steps.prepare.outputs.buffer }}
        METADATA_BUFFER: ${{ steps.prepare.outputs.metadata-buffer }}
        EXPORT_VERIFY_PDA: ${{ inputs.export-verify-pda }}
      # One consolidated block: both buffer addresses and the program buffer's
      # verifiable hash next to the local build's hash, so a multisig signer can
      # confirm the staged program matches the source in one place before
      # approving the Squads proposal (or re-run `solana-verify get-buffer-hash`
      # / `verify-from-repo` themselves). Non-fatal: a hashing hiccup must not
      # fail an otherwise-good buffer upload.
      run: |
        set -uo pipefail
        # solana-verify loads the Solana CLI config file even when --url is passed;
        # on a fresh runner it doesn't exist ("Failed to load config file"), so
        # create it first.
        solana config set --url "$RPC_URL" >/dev/null 2>&1 || true
        SO="target/deploy/${PROGRAM}.so"
        LOCAL_HASH="(unavailable — .so not present)"
        if [ -f "$SO" ]; then
          LOCAL_HASH="$(solana-verify get-executable-hash "$SO" 2>/dev/null || echo '(hash failed)')"
        fi
        BUFFER_HASH="$(solana-verify get-buffer-hash --url "$RPC_URL" "$BUFFER" 2>/dev/null || echo '(hash failed)')"
        if [ "$BUFFER_HASH" = "$LOCAL_HASH" ]; then VERDICT="✅ buffer hash matches local verifiable build"; else VERDICT="❌ MISMATCH — do not approve"; fi
        {
          echo "==================== deploy summary ===================="
          echo "program:                 $PROGRAM"
          echo "program buffer:          $BUFFER"
          echo "metadata (IDL) buffer:   $METADATA_BUFFER"
          echo "verify PDA exported:     $EXPORT_VERIFY_PDA"
          echo "program buffer hash:     $BUFFER_HASH"
          echo "local verifiable .so:    $LOCAL_HASH"
          echo "verification:            $VERDICT"
          echo "========================================================"
        }
        {
          echo "### ${PROGRAM} buffer — verify before approving the Squads proposal"
          echo ""
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| program buffer | \`${BUFFER}\` |"
          echo "| metadata (IDL) buffer | \`${METADATA_BUFFER}\` |"
          echo "| on-chain buffer hash | \`${BUFFER_HASH}\` |"
          echo "| local verifiable .so hash | \`${LOCAL_HASH}\` |"
          echo "| verify PDA exported | \`${EXPORT_VERIFY_PDA}\` |"
          echo "| verification | ${VERDICT} |"
        } >> "$GITHUB_STEP_SUMMARY"
