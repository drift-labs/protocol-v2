name: main

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, devnet]

defaults:
  run:
    shell: bash
    working-directory: .

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.91.1
  SOLANA_VERSION: 2.3.11
  ANCHOR_VERSION: 1.0.0
  NODE_VERSION: "24.x.x"
  # solanafoundation/solana-verifiable-build tags lag behind agave releases;
  # check https://hub.docker.com/r/solanafoundation/solana-verifiable-build/tags
  # for the latest available tag before bumping SOLANA_VERSION above.
  # Image picks the SBF platform-tools toolchain used by `cargo build-sbf`.
  # 2.3.x images ship platform-tools v1.48 (rustc 1.84) which cannot parse
  # edition2024 crates pulled in transitively by Anchor 1.0; 3.1.x ships
  # v1.52 (rustc 1.89) which matches the Anchor 1.0 MSRV. The SBF byte code
  # remains compatible with the agave 2.3.11 runtime targeted by SOLANA_VERSION.
  VERIFIABLE_BUILD_IMAGE: solanafoundation/solana-verifiable-build:3.1.14

jobs:
  fmt-clippy:
    name: fmt & clippy
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust nightly
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
          components: rustfmt, clippy
      - name: Cache build files
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Cargo clippy
        run: cargo clippy -p drift
  unit-tests:
    name: Unit tests
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
      - name: Run package checks
        run: cargo check # run package checks
      - name: Run unit tests
        run: cargo test --lib # run unit tests
# disable until solana-client is upgraded
#  cargo-audit:
#    name: Cargo audit
#    runs-on: ubicloud
#    steps:
#      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
#      - name: Cache cargo-audit version
#        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
#      - name: Download cargo-audit
#        uses: actions-rs/install@v0.1
#        with:
#          crate: cargo-audit
#          version: latest
#      - name: Run cargo-audit # Using args from .cargo/audit.toml
#        run: cargo audit
  prettier:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print prettier version
        run: bunx prettier --version
      - name: Run prettier
        run: bun run prettify
  lint:
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint
        run: bun run lint
  anchor-tests:
    name: Anchor tests
    runs-on: ubicloud
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          profile: minimal
          override: true
      - name: Cache build artefacts
        uses: Swatinem/rust-cache@81d053bdb0871dcd3f10763c8cc60d0adc41762b # v1
        with:
          cache-on-failure: "true"

      - uses: ./.github/actions/setup-solana/

      - name: Cache Anchor CLI
        id: cache-anchor
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.avm
          key: ${{ runner.os }}-anchor-cli-${{ env.ANCHOR_VERSION }}

      - name: Install Anchor CLI
        # if: steps.cache-anchor.outputs.cache-hit != 'true'
        run: |
          sudo apt update -y && sudo apt install libudev-dev
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}

      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: install typescript
        run: npm install typescript@5.4.5 -g

      - name: install mocha
        run: |
          npm install ts-mocha@10.0.0 -g
          npm install --global mocha

      - name: build sdk
        run: cd sdk/ && bun install --frozen-lockfile && bun run build && cd ..

      - name: run anchor tests
        env:
          RUST_LOG: solana_runtime::message_processor::stable_log=info
        run: bash test-scripts/run-anchor-tests.sh
  verify-sdk-configs:
    name: Verify SDK Configs
    if: ${{ false }}
    runs-on: ubicloud
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: |
          cd sdk/
          bun install --frozen-lockfile
          bun run build
          cd ..

      - name: Install ts-mocha and typescript
        run: |
          npm install -g ts-mocha
          npm install -g typescript@5.4.5

      - name: Run tests
        env:
          MAINNET_RPC_ENDPOINT: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          DEVNET_RPC_ENDPOINT: ${{ secrets.DEVNET_RPC_ENDPOINT }}
        run: ts-mocha ./sdk/tests/ci/*


  check-for-sdk-changes:
    runs-on: ubicloud
    # Set job outputs to values from filter step
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            sdk:
              - 'sdk/**'
  check-for-cli-admin-changes:
    runs-on: ubicloud
    outputs:
      cli_admin: ${{ steps.filter.outputs.cli_admin }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            cli_admin:
              - 'cli-admin/**'
  release:
    runs-on: ubicloud
    needs:
      [
        fmt-clippy,
        unit-tests,
#        cargo-audit,
        prettier,
        lint,
        check-for-sdk-changes,
      ]
    if: ${{ github.ref == 'refs/heads/master' && needs.check-for-sdk-changes.outputs.sdk == 'true' }}
    # Trusted publishing to npm via OIDC — see https://docs.npmjs.com/trusted-publishers
    permissions:
      contents: write   # required to push the version-bump commit back to master
      id-token: write   # required for npm trusted publishing (OIDC token exchange)
    defaults:
      run:
        working-directory: ./sdk
    outputs:
      version: ${{ steps.git-commit.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm CLI supports trusted publishing
        # npm trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@11.14.1
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build
      - name: Update package version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version);")
          [[ "$VERSION" == *beta* ]] && npm version prerelease --preid=beta || npm version preminor --preid=beta
          echo "PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version);")" >> $GITHUB_ENV
      - name: Git commit
        id: git-commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ..
          git commit -a -m "sdk: release v$PACKAGE_VERSION"
          git pull --rebase origin master
          git push origin HEAD || {
            echo "Push failed. Retrying after pulling latest changes..."
            git pull --rebase origin master
            git push origin HEAD
          }
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
      - name: Publish to npm
        # Authenticates via OIDC (trusted publishing). Provenance attestations
        # are attached automatically — no --provenance flag, no NPM_TOKEN.
        run: |
          if [[ "$PACKAGE_VERSION" == *beta* ]]; then
            npm publish --access=public --tag beta
          elif [[ "$PACKAGE_VERSION" == *alpha* ]]; then
            npm publish --access=public --tag alpha
          else
            npm publish --access=public
          fi
      - name: Build sdk for browser
        run: |
          bun install --frozen-lockfile
          bun run build:browser
          # Update package name for browser version while keeping the same version
          node -e "const pkg = require('./package.json'); pkg.name = pkg.name + '-browser'; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
      - name: Publish browser version to npm
        # Trusted publishing also covers the -browser variant — must be configured
        # separately on npmjs.com for the @velocity-exchange/sdk-browser package.
        run: |
          if [[ "$PACKAGE_VERSION" == *beta* ]]; then
            npm publish --access=public --tag beta
          elif [[ "$PACKAGE_VERSION" == *alpha* ]]; then
            npm publish --access=public --tag alpha
          else
            npm publish --access=public
          fi
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: '#code-review'
          slack-message: '<!here> ❌ Deployment failed! Check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  release-cli-admin:
    runs-on: ubicloud
    needs:
      [
        fmt-clippy,
        unit-tests,
        prettier,
        lint,
        check-for-cli-admin-changes,
        # Optional dep on `release` so the SDK is published *first* when both
        # change in the same commit, ensuring cli-admin pins to a real version
        # range that npm can resolve. `always()` lets us run when SDK release
        # is skipped (cli-admin-only change). The job itself no-ops on its own
        # `if:` when cli-admin didn't change.
        release,
      ]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.check-for-cli-admin-changes.outputs.cli_admin == 'true' }}
    # Trusted publishing to npm via OIDC — see https://docs.npmjs.com/trusted-publishers
    permissions:
      contents: write   # required to push the version-bump commit back to master
      id-token: write   # required for npm trusted publishing (OIDC token exchange)
    defaults:
      run:
        working-directory: ./cli-admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Need full history + token so we can commit the version bump back.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Setup node
        uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm CLI supports trusted publishing
        # npm trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@11.14.1
      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Pull latest (sdk release may have just pushed)
        run: git pull --rebase origin master
      - name: Install + build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Bump cli-admin version
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version);")
          [[ "$VERSION" == *beta* ]] && npm version prerelease --preid=beta --no-git-tag-version || npm version preminor --preid=beta --no-git-tag-version
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version);")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
      - name: Commit version bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git commit -m "cli-admin: release v$PACKAGE_VERSION"
          git pull --rebase origin master
          git push origin HEAD || {
            echo "Push failed. Retrying after pulling latest changes..."
            git pull --rebase origin master
            git push origin HEAD
          }
      - name: Pin @velocity-exchange/sdk dep + publish
        # `publish-cli` rewrites file:../sdk to a real semver range based on
        # sdk/package.json before publishing, then restores it after. The
        # restored file:.. doesn't get committed — it's purely so the local
        # checkout matches the committed state if anything inspects it.
        #
        # Authenticates via OIDC (trusted publishing). Provenance attestations
        # are attached automatically — no --provenance flag, no NPM_TOKEN.
        run: |
          if [[ "$PACKAGE_VERSION" == *beta* ]]; then
            bun run build && bun run prepare-publish && (npm publish --access=public --tag beta; status=$?; bun run restore-publish; exit $status)
          else  
            bun run build && bun run prepare-publish && (npm publish --access=public; status=$?; bun run restore-publish; exit $status)
          fi
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: '#code-review'
          slack-message: '<!here> ❌ cli-admin release failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
  emit-dispatch-events:
    runs-on: ubicloud
    needs: [release, check-for-sdk-changes]
    if: ${{ github.ref == 'refs/heads/master' && needs.check-for-sdk-changes.outputs.sdk == 'true' }}
    strategy:
      matrix:
        repo:
          [
            "jit-proxy",
            "dlob-server",
            "drift-vaults",
            "drift-common",
            "drift-ffi-sys",
            "drift-rs",
            "swift"
          ]
    steps:
      - name: Checkout code with new updated version
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Emit dispatch event
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/drift-labs/${{ matrix.repo }}/dispatches" \
            -d "{\"event_type\": \"sdk-update\", \"client_payload\": {
              \"version\": \"$VERSION\"
            }}"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: ./sdk
  check-for-program-version-changes:
    runs-on: ubicloud
    # Set job outputs to values from filter step
    outputs:
      program: ${{ steps.filter.outputs.program }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            program:
              - 'programs/drift/Cargo.toml'
  verified-build:
    name: Build Verifiable Artifact
    runs-on: ubicloud
    needs:
      [
          check-for-program-version-changes,
      ]
    if: ${{ needs.check-for-program-version-changes.outputs.program == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Solana Verify CLI
        run: |
          sudo apt update -y && sudo apt install libudev-dev
          cargo install solana-verify --version 0.4.11

      - name: Verifiable Build
        run: |
          solana-verify build --library-name drift -b ${{ env.VERIFIABLE_BUILD_IMAGE }}

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build
          path: target/deploy/drift.so
