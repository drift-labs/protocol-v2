name: Release Program to Mainnet

# Mainnet program upgrades are gated by a `program-velocity-<version>` tag.
# The workflow only PROPOSES the Squads transaction; multisig signers must
# approve + execute via the Squads UI.

on:
  push:
    tags:
      - "program-velocity-*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.91.1
  SOLANA_VERSION: 2.3.11
  ANCHOR_VERSION: 1.0.0
  NODE_VERSION: "24.x.x"
  VERIFIABLE_BUILD_IMAGE: solanafoundation/solana-verifiable-build:3.1.14
  VELOCITY_MAINNET_PROGRAM_ID: vELoC1audYbSYVRXn1vPaV8Axoa9oU6BYmNGZZBDZ1P

jobs:
  release:
    name: Build + propose mainnet upgrade
    runs-on: ubicloud
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse tag
        id: tag
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          # program-velocity-<version>
          VERSION=$(echo "$TAG" | sed 's/^program-velocity-//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "Tag '$TAG' does not match program-velocity-<version>" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build velocity (mainnet)
        uses: ./.github/actions/build-program/
        with:
          program: velocity
          devnet: "false"

      # The IDL is published on-chain as a program-metadata buffer by the
      # buffer-deploy action below (and applied by the Squads proposal), so there
      # is no need to also attach it to a GitHub release.

      - name: Buffer deploy (mainnet)
        id: buffer-deploy
        uses: ./.github/actions/buffer-deploy/
        with:
          program: velocity
          program-id: ${{ env.VELOCITY_MAINNET_PROGRAM_ID }}
          rpc-url: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          keypair: ${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}
          buffer-authority: ${{ secrets.MAINNET_MULTISIG_VAULT }}
          # Record an on-chain solana-verify PDA (source proof) in the proposal.
          # DISABLED until this repo is public: `solana-verify export-pda-tx` does an
          # anonymous `git clone` of repo-url on the runner, which fails for a private
          # repo ("Failed to clone repository"). The verify PDA is only meaningful once
          # third parties can clone the source to reproduce the build, so flip this back
          # to "true" when the repo is open-sourced.
          export-verify-pda: "false"
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          commit-hash: ${{ github.sha }}

      # The canonical IDL metadata account is created once at initial deploy (see
      # deploy-scripts/README.md), so every release is a single-tx SetData +
      # Upgrade (+ verify PDA) proposal via the official Solana Foundation action.
      - name: Propose Squads upgrade
        uses: solana-foundation/squads-program-action@839c079c881344c2da0365ad6a6bb07892e08e2f # v0.4.3
        with:
          rpc: ${{ secrets.MAINNET_RPC_ENDPOINT }}
          program: ${{ env.VELOCITY_MAINNET_PROGRAM_ID }}
          multisig: ${{ secrets.MAINNET_MULTISIG }}
          vault-index: "0"
          buffer: ${{ steps.buffer-deploy.outputs.buffer }}
          metadata-buffer: ${{ steps.buffer-deploy.outputs.metadata-buffer }}
          pda-tx: ${{ steps.buffer-deploy.outputs.pda-tx }}
          keypair: ${{ secrets.MAINNET_DEPLOYER_KEYPAIR }}
