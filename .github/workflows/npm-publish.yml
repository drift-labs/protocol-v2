name: npm-publish

# Push a tag `release-v<n>` to publish. Builds the workspace, then publishes every
# non-private package under packages/* whose committed version isn't already on the
# registry (idempotent — re-running a tag is a no-op). Versions are set beforehand by
# the changesets "Version Packages" PR (see changesets.yml).
#
# Uses `bun publish` (NOT `changeset publish`/`npm publish`) because bun rewrites
# `workspace:*` dependency ranges to the concrete version in the published manifest —
# this is what lets cli-admin depend on the local sdk without a pre-publish rewrite hack.
on:
  push:
    tags:
      - 'release-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish changed library packages
        run: |
          set -euo pipefail
          for pkg in packages/*; do
            [ -f "$pkg/package.json" ] || continue
            if [ "$(node -p "require('./$pkg/package.json').private || false")" = "true" ]; then
              echo "skip (private): $pkg"; continue
            fi
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            published=$(npm view "$name@$ver" version 2>/dev/null || echo "")
            if [ "$published" = "$ver" ]; then
              echo "skip (already published): $name@$ver"; continue
            fi
            echo "publishing $name@$ver"
            ( cd "$pkg" && bun publish --access public )
          done
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@e28cf165c92ffef168d23c5c9000cffc8a25e117 # v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: '#code-review'
          slack-message: '<!here> ❌ npm publish failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
