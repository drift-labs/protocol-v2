name: changesets

# Maintains the "Version Packages" PR: on every push to master it opens/updates a
# PR that runs `changeset version` (bumps versions + writes CHANGELOGs for the
# packages with pending changesets). Merging that PR commits the version bumps.
# Publishing is a separate, tag-triggered step — see npm-publish.yml.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Create or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # Wrapper retries the transient @changesets/changelog-github GitHub
          # GraphQL fetch failure (ERR_STREAM_PREMATURE_CLOSE) that was failing
          # this job on ~half of pushes. See the script for details.
          version: bash .github/scripts/changeset-version.sh
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
