[package]
name = "velocity"
version = "2.162.1"
description = "Created with Anchor"
edition = "2018"

[lib]
crate-type = ["cdylib", "lib"]
name = "velocity"
path = "src/lib.rs"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
mainnet-beta = []
# Post-audit features: compiled out of mainnet builds until audited.
# Enable on mainnet by adding them to the mainnet build invocation and upgrading.
isolated-position = []
vlp-hedge = []
anchor-test = ["isolated-position", "vlp-hedge"]
anchor-debug = []
default = ["mainnet-beta", "no-entrypoint"]
velocity-rs = []
idl-build = [
  "anchor-lang/idl-build",
  "anchor-spl/idl-build",
]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
solana-program = "3"
borsh = "1"
pyth-client = "0.2.2"
pyth_lazer = { path = "../pyth-lazer", features = ["no-entrypoint"] }
bytemuck = { version = "1.4.0", features = ["min_const_generics"] }
hex = "0.4.3"
num-traits = "0.2"
uint = { version = "0.9.1", default-features = false }
num-integer = "0.1.44"
arrayref = "0.3.6"
base64 = "0.13.0"
enumflags2 = "0.6.4"
solana-security-txt = "1.1.0"
static_assertions = "1.1.0"
byteorder = "1.4.3"

[dev-dependencies]
bytes = "1.2.0"
pyth = { path = "../pyth", features = ["no-entrypoint"]}
base64 = "0.13.0"
